<!doctype html><meta charset="utf-8"><title>Pages QA</title><style>body{margin:0}iframe{border:0;display:block}pre{white-space:pre-wrap}</style><pre id="results">Running</pre><div id="stage"></div><script>
(async()=>{let rows=[];for(const page of ['services','news','contacts','licenses','promotions','useful','about','payment'])for(const width of [320,390,768,1024,1366,1920]){let f=document.createElement('iframe');f.width=width;f.height=900;f.src=page+'.html';stage.append(f);await new Promise(r=>f.onload=r);let d=f.contentDocument;await new Promise(r=>setTimeout(r,80));let issues=[];if(d.documentElement.scrollWidth>width+1)issues.push('overflow '+d.documentElement.scrollWidth);if(d.querySelectorAll('h1').length!==1)issues.push('h1');d.querySelector('button.footer__btn').click();if(d.querySelector('#callback-popup').hidden)issues.push('callback');d.querySelector('.popup__exit').click();let more=d.querySelector('.services__btn,.news__btn,.sales__btn');if(more){let before=d.querySelectorAll('.list__item[hidden]').length;more.click();if(d.querySelectorAll('.list__item[hidden]').length>=before)issues.push('show more')};rows.push({page,width,issues});f.remove();results.textContent=JSON.stringify(rows,null,2)}results.dataset.done='true'})();
</script>
